version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Runs at the repo root so npm workspaces links sundraft-shared
        # into frontend/node_modules — the frontend build can't resolve
        # its shared-package import otherwise.
        - npm ci
    build:
      commands:
        - npm run build --workspace=frontend
  artifacts:
    baseDirectory: frontend/dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
